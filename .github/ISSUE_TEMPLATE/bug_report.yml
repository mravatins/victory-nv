name: Bug report
description: A crash, hang, device loss or wrong rendering
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach any title files, dumps or extracted content (see docs/asset-policy.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what you saw, and how to reproduce it.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and driver
      placeholder: GPU, driver version, CPU, RAM, Windows build
    validations:
      required: true
  - type: textarea
    id: switches
    attributes:
      label: Environment switches
      placeholder: VICTORY_* variables set, release or diag build
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: crashes.log and relevant log lines.
      render: text
